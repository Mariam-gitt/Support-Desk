<!doctype html>
<!-- The single HTML page; React draws the whole app inside the "root" element -->
<html lang="en">
  <head>
    <!-- Text encoding -->
    <meta charset="UTF-8" />
    <!-- Makes the page scale correctly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The browser tab title -->
    <title>Support Desk</title>
  </head>
  <body>
    <!-- React renders the app here -->
    <div id="root"></div>
    <!-- Vite loads our code from this file -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
